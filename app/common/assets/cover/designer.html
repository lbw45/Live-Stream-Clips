      framesLoaded = true;
      renderFrames(d);
    } catch (e) {
      $("frameList").innerHTML = '<div class="fmsg">取帧失败：' + esc(e.message || e) + "</div>";
    } finally {
      btn.disabled = false;
      btn.innerHTML = old;
    }
  }

  /* v4.86：左侧列展开/收起（收起只留图标按钮，画布拿回宽度） */
  function syncFrameCol() {
    const col = $("frameCol");
    if (!col) return;
    col.classList.toggle("collapsed", !framesOpen);
    $("btnFrames").title = framesOpen
      ? "收起候选帧（Shift+点 = 忽略缓存重新找）"
      : "从成片里找画面最干净（没有字幕/字样）的几帧，选一张当封面底图";
  }

  function renderFrames(d) {
    const list = $("frameList");
    const frames = d.frames || [];
    if (!frames.length) { list.innerHTML = '<div class="fmsg">没找到候选帧</div>'; return; }
    list.innerHTML = frames.map(function (f, i) {
      const clean = (f.subBlocks || 0) === 0;
      const label = clean ? "✓ 无字幕" : ("含字幕 " + f.subBlocks);
      return '<button class="frameitem' + (clean ? " clean" : "") + '" data-i="' + i + '"' +
        ' title="' + esc(f.tSec.toFixed(1) + "s · " + (clean ? "没有字幕" : ("字幕 " + f.subBlocks + " 处")) +
          " · 干净分 " + f.clean + (f.texts && f.texts.length ? ("\n画面文字：" + f.texts.join(" / ")) : "")) +
        '"><img src="' + f.thumb + '" alt=""><span class="fs">' + esc(label) + "</span></button>";
    }).join("");
    if (d.degraded) {
      list.insertAdjacentHTML("beforeend",
        '<div class="fmsg">OCR 不可用，按画面边缘估算（仅供筛选）</div>');
    } else if (d.cleanTotal === 0) {
      list.insertAdjacentHTML("beforeend",
        '<div class="fmsg">本片每帧都有字幕，已按"字幕最少"排序</div>');
    } else {
      list.insertAdjacentHTML("beforeend",
        '<div class="fmsg">全场 ' + d.pool + " 帧里，" + d.cleanTotal + " 帧无字幕" +
        (d.cached ? "（缓存）" : "") + "</div>");
    }
  }

  $("btnFrames").addEventListener("click", function (ev) {
    /* v4.86：折叠式 —— 收起态只留图标（不挤画布）；点开时才去找帧。
       Shift+点 = 忽略缓存强制重算。 */
    if (ev.shiftKey) {
      framesOpen = true;
      syncFrameCol();
      loadFrames(true);
      return;
    }
    if (framesOpen) {
      framesOpen = false;
      syncFrameCol();
      return;
    }
    framesOpen = true;
    syncFrameCol();
    if (!framesLoaded) loadFrames(false);
  });
  $("frameList").addEventListener("click", async function (ev) {
    const b = ev.target.closest && ev.target.closest(".frameitem");
    if (!b) return;
    const f = (window.__frames || [])[parseInt(b.dataset.i, 10)];
    if (!f) return;
    b.disabled = true;
    try {
      const r = await slicer("POST", "/api/edits/cover/frame", {name: FILM, frame: f.name});
      const d = (r && r.data) || {};
      if (r.status !== 200 || !d.ok) {
        setStatus("换成这一帧失败：" + (d.error || r.status), "err");
        return;
      }
      /* 底图按比例缓存了 data URI —— 换图必须全清，否则看到的还是旧图 */
      Object.keys(BASE_CACHE).forEach(function (k) { delete BASE_CACHE[k]; });
      document.querySelectorAll("#frameList .frameitem").forEach(function (x) {
        x.classList.remove("on");
      });
      b.classList.add("on");
      loadBase(true);
      setStatus("已换成 " + f.tSec.toFixed(1) + "s 那一帧（点「生成封面」才会写进四档）", "ok");
    } finally {
      b.disabled = false;
    }
  });

  function toHex(v, dflt) {
    return (v && /^#[0-9a-fA-F]{6}$/.test(v)) ? v.toLowerCase() : dflt;
  }

  function syncHex() {
    $("fill1Hex").textContent = String($("fill1").value || "").toUpperCase();
    $("fill2Hex").textContent = String($("fill2").value || "").toUpperCase();
    $("strokeHex").textContent = String($("strokeFill").value || "").toUpperCase();
  }

  /* ---------------- v5.2：文案多输入行 ----------------
     需求：「文案输入文字的输入框位置，增减输入框，默认是一个输入框，新增一个就一行文案，
     选中哪条文案才能点击 AI 优化文案，是否换行按钮可以去掉了」。
     ⇒ `copy.lines` 是唯一真源（数组，每条 = 画布一行，最多 5 条）；老配置按 line1/line2 迁移。 */
  let selLine = 0;                       // 当前选中的那一行（AI 只作用于它）

  function copyLines() {
    if (!cfg) return [""];
    cfg.copy = cfg.copy || {};
    if (!Array.isArray(cfg.copy.lines)) {
      const cp = cfg.copy;
      let arr;
      if (String(cp.line1 || "").trim() || String(cp.line2 || "").trim()) {
        arr = [cp.line1 || "", cp.line2 || ""];           // 老配置：两行原样恢复
      } else if (String(cp.text || "").trim()) {
        arr = String(cp.text).split(/\r?\n/);             // 再老：按回车/整段
      } else {
        arr = [""];
      }
      arr = arr.map(function (x) { return String(x || "").trim(); }).filter(Boolean);
      cfg.copy.lines = (arr.length ? arr : [""]).slice(0, 5);
    }
    if (!cfg.copy.lines.length) cfg.copy.lines = [""];
    return cfg.copy.lines;
  }

  function renderCopyRows() {
    const rows = copyLines();
    if (selLine > rows.length - 1) selLine = rows.length - 1;
    if (selLine < 0) selLine = 0;
    $("copyRows").innerHTML = rows.map(function (v, i) {
      return '<div class="crow' + (i === selLine ? " on" : "") + '" data-i="' + i + '">' +
        '<span class="idx">' + (i + 1) + "</span>" +
        '<input type="text" maxlength="30" data-i="' + i + '" value="' + esc(v) + '" ' +
        'placeholder="' + (i === 0 ? "第一行文案（≤30 字）" : "第 " + (i + 1) + " 行文案") + '">' +
        (rows.length > 1 ? '<button class="del" data-del="' + i + '" title="删掉这一行">×</button>' : "") +
        "</div>";
    }).join("");
    $("copyLinesTag").textContent = rows.length + " 行";
    updateCount();
  }

  function updateCount() {
    if (!cfg) { $("copyCount").textContent = "0/30"; return; }
    const rows = copyLines();
    const v = String(rows[Math.max(0, Math.min(selLine, rows.length - 1))] || "");
    $("copyCount").textContent = v.length + "/30";
  }

  /* ---------------- 背景（v4.82）：cfg.background ⇄ 控件 ━━━━━━━━━ */
  function readBg() {
    const b = (cfg && cfg.background) || {};
    const rawBlur = (b.blur === undefined || b.blur === null || b.blur === "") ? 22 : Number(b.blur);
    const rawShade = (b.shade === undefined || b.shade === null || b.shade === "") ? 0.47 : Number(b.shade);
    const f = (b.focus && typeof b.focus === "object") ? b.focus : {};
    const fnum = function (v, dflt) {
      const n = Number(v);
      return isFinite(n) ? Math.max(0, Math.min(1, n)) : dflt;
    };
    bg = {
      on: b.on !== false,
      blur: Math.max(0, Math.min(40, isFinite(rawBlur) ? Math.round(rawBlur) : 22)),
      shade: Math.max(0, Math.min(0.85, isFinite(rawShade) ? rawShade : 0.47)),
      focus: {x: 0.5, y: 0.35},
      zoom: 1,
      focusByRatio: {},
      zoomByRatio: {}
    };
    /* v5.0：按比例存档；老配置（单值 focus/zoom）迁到**当前比例**，其余比例用默认 */
    const byF = (b.focusByRatio && typeof b.focusByRatio === "object") ? b.focusByRatio : {};
    const byZ = (b.zoomByRatio && typeof b.zoomByRatio === "object") ? b.zoomByRatio : {};
    Object.keys(byF).forEach(function (k) {
      const v = byF[k] || {};
      bg.focusByRatio[k] = {x: fnum(v.x, 0.5), y: fnum(v.y, 0.35)};
    });
    Object.keys(byZ).forEach(function (k) {
      const v = Number(byZ[k]);
      if (isFinite(v)) bg.zoomByRatio[k] = Math.max(1, Math.min(3, v));
    });
    const cur = bg.focusByRatio[ratio] || {x: fnum(f.x, 0.5), y: fnum(f.y, 0.35)};
    bg.focus = {x: cur.x, y: cur.y};
    bg.focusByRatio[ratio] = {x: cur.x, y: cur.y};
    const cz = bg.zoomByRatio[ratio];
    const z0 = isFinite(Number(cz)) ? Number(cz)
             : (isFinite(Number(b.zoom)) ? Number(b.zoom) : 1);
    bg.zoom = Math.max(1, Math.min(3, z0));
    bg.zoomByRatio[ratio] = bg.zoom;
  }
  function paintRange(el) {
    const min = parseFloat(el.min || "0");
    const max = parseFloat(el.max || "100");
    const v = parseFloat(el.value || "0");
    const pct = max > min ? ((v - min) / (max - min)) * 100 : 0;
    el.style.setProperty("--p", pct.toFixed(1) + "%");
  }
  function updateBgBadge() {
    $("btnBg").textContent = bg.on ? "🎛 背景 · 模糊 " + bg.blur : "🎛 背景 · 原图";
    const isDefault = bg.on && bg.blur === 22 && Math.abs(bg.shade - 0.47) < 0.005;
    $("btnBg").classList.toggle("on", !isDefault);
  }
  function applyBg(writeCfg) {
    $("bgOn").classList.toggle("on", bg.on);
    $("bgOn").setAttribute("aria-checked", bg.on ? "true" : "false");
    $("bgBlur").value = String(bg.blur);
    $("bgBlur").disabled = !bg.on;
    $("bgShade").value = String(Math.round(bg.shade * 100));
    $("bgBlurVal").textContent = String(bg.blur);
    $("bgShadeVal").textContent = Math.round(bg.shade * 100) + "%";
    paintRange($("bgBlur"));
    paintRange($("bgShade"));
    updateBgBadge();
    $("bgFocusVal").textContent = Math.round(bg.focus.x * 100) + "% · " +
      Math.round(bg.focus.y * 100) + "%";
    if (writeCfg && cfg) {
      const _f = {x: Number(bg.focus.x.toFixed(4)), y: Number(bg.focus.y.toFixed(4))};
      bg.focusByRatio[ratio] = _f;                     // v5.0：按比例存档
      bg.zoomByRatio[ratio] = Number(bg.zoom.toFixed(3));
      cfg.background = {on: bg.on, blur: bg.blur, shade: Number(bg.shade.toFixed(3)),
                        focusByRatio: bg.focusByRatio,
                        zoomByRatio: bg.zoomByRatio,
                        focus: _f,                     // 单值镜像（老版本读法兼容）
                        zoom: Number(bg.zoom.toFixed(3))};
    }
  }
  /* 滑块拖动时不要每个 px 都请求：260ms 防抖，请求期间画布显示"正在应用背景…" */
  function scheduleBaseRefresh() {
    /* v4.98：模糊/压暗/取景都改成本地 CSS 立即生效（原来每次都要请求后端重渲染，260ms 防抖）。
       出图仍由后端按 cfg 精确渲染 —— 位置公式两边一致，模糊是近似。 */
    if (bgTimer) clearTimeout(bgTimer);
    bgTimer = setTimeout(function () {
      layoutPhoto();
      if ($("bgMsg")) $("bgMsg").textContent = "已更新（未保存）";
    }, 60);
  }

  /* ---------------- v4.89：每个比例一套元素 ----------------
     需求（2026-11-14）：「我在 3:4 封面图的最下方放个表情，切换到其他比例时这个元素会跟随着
     跑到最下面，我需要的是其他比例是不同样式的元素的」。
     旧实现只有**一份** cfg.emojis（百分比坐标），四个比例共用 —— 换了画布高宽比，同一个百分比
     位置看起来就"跑"了。现在：cfg.emojisByRatio = {key: [...]} 各存各的；
     cfg.emojis 始终是**当前比例**那份（既有渲染/保存代码一行不用改）；
     cfg.ratioSync = true 时退回旧的"四个比例共用一套"。
     ⚠️ 默认 **false**（各比例独立）——这正是用户要的。 */
  function ratioSyncOn() { return !!(cfg && cfg.ratioSync); }
  function stashEmojis() {
    if (!cfg) return;
    cfg.emojisByRatio = cfg.emojisByRatio || {};
    cfg.emojisByRatio[ratio] = cfg.emojis || [];
  }
  function loadEmojiSetFor(key) {
    if (!cfg) return;
    if (!ratioSyncOn()) cfg.emojis = (cfg.emojisByRatio || {})[key] || [];
    selEmo = -1;
    syncEmojiSelFromCfg();
    renderEmojiChips();
    paintEmoji();
  }

  function syncControls() {
    const st = cfg.style || {};
    const cp = cfg.copy || {};
    copyLines();               // v5.2：把老配置（line1/line2/text）迁成 lines
    $("fill1").value = toHex(st.fill1, "#ff78c8");
    $("fill2").value = toHex(st.fill2, "#ffbe28");
    $("strokeFill").value = toHex(st.strokeFill, "#ffffff");
    $("tplSel").innerHTML = TPLS.map(function (t) {
      return '<option value="' + t.key + '">' + esc(t.label) + "</option>";
    }).join("");
    $("tplSel").value = cfg.template || "A";
    renderCopyRows();          // v5.2：文案多输入行（含选中态与字数）
    syncAllRanges();           // v4.94：滑块绿条按当前值初始化（含背景模糊/压暗）
    /* v4.89：字号（% of 画布宽）/ 描边（px）改成数值框 —— 直接回填数字 */
    $("sizeNum").value = String(Math.round(parseFloat(st.sizeRatio || 0.12) * 100));
    $("strokeNum").value = String(Math.round(parseFloat(st.strokeWidth || 10)));
    $("tabNormal").classList.toggle("on", (cfg.template || "A") !== "C");
    $("tabFlower").classList.toggle("on", (cfg.template || "A") === "C");
    $("emoGrid").querySelectorAll(".emoPick").forEach(function (b) {
      b.classList.toggle("on", emojiSel.has(b.dataset.code));
    });
    renderTplCards();
    renderEmojiChips();
    renderMyStyles();
    syncHex();
    updateCount();
    readBg();
    applyBg(true);          // 配置里的背景参数写回控件，并补一份到 cfg（保存时一起落盘）
  }

  function renderEmojiChips() {
    const box = $("emoChips");
    /* v4.86：**按实例**渲染（不是按 code 去重）—— 同一个 emoji 加两次就是两颗 chip，
       各自有位置和大小；点 chip = 选中它（配合下方大小滑块），点 × = 只删这一颗。 */
    const list = (cfg && cfg.emojis) || [];
    if (!list.length) {
      box.innerHTML = '<span class="msg">还没加 emoji —— 点上面的按钮挑一个（同一个可以加多次）</span>';
      syncEmoSize();
      return;
    }
    box.innerHTML = list.map(function (e, i) {
      const isImg = (e.type === "image");
      const it = isImg ? { name: "图片" }
        : (catalog.filter(function (c) { return c.code === e.code; })[0] || { name: e.code });
      const on = (i === selEmo) ? " on" : "";
      const thumb = isImg
        ? '<img data-img="' + i + '" alt="">'
        : '<img data-code="' + esc(e.code) + '" alt="">';
      return '<span class="chip' + on + '" data-i="' + i + '" title="点这里选中它，再用下面的滑块调大小">' +
        thumb + '<span>' + esc(it.name) + "</span>" +
        ' <b data-del="' + i + '" title="只移除这一个">×</b></span>';
    }).join("");
    box.querySelectorAll("img[data-code]").forEach(function (im) {
      emoData(im.dataset.code).then(function (url) { if (url) im.src = url; });
    });
    box.querySelectorAll("img[data-img]").forEach(function (im) {
      const e = list[parseInt(im.dataset.img, 10)];
      if (e) im.src = e.data || "";
    });
    syncEmoSize();
  }

  /* v4.94（用户：「emoji 大小滑块左右滑动时，绿色条没有跟着滑块移动，固定在一半」）：
     根因：range 的轨道用 `linear-gradient(90deg, accent var(--p,50%), …)` 画填充，
     但 **没有任何地方更新 `--p`** ⇒ 永远 50%。这里按当前值算出百分比写回去。
     用事件委托挂在 document 上，以后新加的滑块（背景模糊/压暗等）也自动生效。 */
  function syncRangeFill(el) {
    if (!el || el.type !== "range") return;
    const min = Number(el.min || 0);
    const max = Number(el.max || 100);
    const v = Number(el.value || 0);
    const pct = (max > min) ? ((v - min) / (max - min)) * 100 : 0;
    el.style.setProperty("--p", Math.max(0, Math.min(100, pct)).toFixed(2) + "%");
  }
  function syncAllRanges() {
    document.querySelectorAll('input[type="range"]').forEach(syncRangeFill);
  }
  document.addEventListener("input", function (ev) {
    const t = ev.target;
    if (t && t.type === "range") syncRangeFill(t);
  }, true);

  /* v4.86：大小滑块 —— 只作用于**当前选中的那一颗** emoji（size 是相对画布宽度） */
  function syncEmoSize() {
    const row = $("emoSizeRow"), sl = $("emoSize"), val = $("emoSizeVal");
    if (!row || !sl || !val) return;
    const e = ((cfg && cfg.emojis) || [])[selEmo];
    if (!e) { row.style.display = "none"; return; }
    row.style.display = "flex";
    const pct = Math.round((e.size || 0.15) * 100);
    sl.value = String(Math.max(4, Math.min(60, pct)));
    val.textContent = pct + "%";
    syncRangeFill(sl);            // v4.94：绿条要跟着滑块走（以前 --p 没人更新，永远停在 50%）
  }
  /* 选中的 code 集合：只用于「选择面板里哪些已加过」的高亮 */
  function syncEmojiSelFromCfg() {
    emojiSel = new Set(((cfg && cfg.emojis) || []).map(function (e) { return e.code; }));
    $("emoGrid").querySelectorAll(".emoPick").forEach(function (b) {
      b.classList.toggle("on", emojiSel.has(b.dataset.code));
    });
  }

  function loadMyStyles() {
    try { return JSON.parse(localStorage.getItem(MYSTYLE_KEY) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function renderMyStyles() {
    const all = loadMyStyles();
    const keys = Object.keys(all);
    $("myStyleSel").innerHTML = keys.length
      ? '<option value="">（选一个套用）</option>' + keys.map(function (k) {
          return '<option value="' + esc(k) + '">' + esc(k) + "</option>";
        }).join("")
      : '<option value="">（还没有保存的样式）</option>';
  }

  /* emoji 面板里的缩略图按需加载（40 张 × 约 7KB base64，本地桥很快；
     不在启动时全拉，避免开窗卡一下） */
  function fillEmojiThumbs() {
    $("emoGrid").querySelectorAll("img[data-code]").forEach(function (im) {
      if (im.getAttribute("src")) return;
      emoData(im.dataset.code).then(function (url) { if (url) im.src = url; });
    });
  }

  /* ---------------- 数据加载 ---------------- */
  async function loadDesign() {
    /* v5.2：`?demo=1` —— 无桥环境（无头截图 / 纯浏览器预览）用内置示例配置渲染 UI。
       必须放在最前面：没有 pywebview 桥时 `slicer()` 的 Promise 永不 settle，后面的代码根本走不到。
       只在显式带参数时生效，正常路径完全不受影响。 */
    if (/[?&]demo=1/.test(location.search)) {
      cfg = {
        template: "A",
        copy: { lines: ["第一行文案演示", "第二行文案演示"],
                line1: "第一行文案演示", line2: "第二行文案演示" },
        style: { sizeRatio: 0.12, lineHeight: 1.08, strokeWidth: 10,
                 fill1: "#FF78C8", fill2: "#FFBE28", strokeFill: "#1b1b1b",
                 align: "left", x: 0.07, y: 0.1 },
        emojis: [], emojisByRatio: {},
        background: { on: true, blur: 22, shade: 0.47 }
      };
      selLine = 1;
      syncControls();
      paintText();
      $("hint").style.display = "none";
      setStatus("演示模式（?demo=1）：仅用于预览界面，不会写任何文件", "warn");
      return;
    }
    setStatus("正在生成/读取封面…");
    try {
      const r = await slicer("POST", "/api/edits/cover", { name: FILM });
      if (r.status !== 200) {
        setStatus("封面生成失败：" + ((r.data && r.data.error) || r.status), "err");
        return;
      }
      covers = (r.data || {}).covers || [];
      const d = await slicer("GET", "/api/edits/cover/design?name=" + encodeURIComponent(FILM));
      if (d.status !== 200 || !(d.data && d.data.ok)) {
        setStatus("设计配置读取失败：" + ((d.data && d.data.error) || d.status), "err");
        return;
      }
      cfg = d.data.config || {};
      catalog = d.data.emojiCatalog || [];
      /* v4.89：老配置只有一份 cfg.emojis ⇒ 归到**当前比例**，其他比例从空开始 */
      cfg.emojisByRatio = cfg.emojisByRatio || {};
      if (!Object.keys(cfg.emojisByRatio).length && cfg.emojis) {
        cfg.emojisByRatio[ratio] = cfg.emojis;
      }
      if (!cfg.ratioSync) cfg.emojis = cfg.emojisByRatio[ratio] || [];
      $("ratioSync").checked = !!cfg.ratioSync;
      emojiSel = new Set((cfg.emojis || []).map(function (e) { return e.code; }));
      $("emoGrid").innerHTML = catalog.map(function (c) {
        return '<button class="emoPick" data-code="' + esc(c.code) + '" data-name="' +
          esc(c.name) + '" title="' + esc(c.name) + '"><img data-code="' + esc(c.code) +
          '" alt=""></button>';
      }).join("");
      applyRatio();
      syncControls();
      paintText();
      setStatus((r.data.generated ? "本次已重新生成" : "已有封面，直接复用") +
        " · 拖动文字/emoji 调位置，改完点「生成封面」", "ok");
    } catch (e) {
      setStatus("加载失败：" + (e.message || e), "err");
    }
  }

  /* ---------------- 事件 ---------------- */
  $("ratios").addEventListener("click", function (ev) {
    const b = ev.target.closest && ev.target.closest(".ratio");
    if (!b) return;
    const next = b.dataset.key || "3x4";
    if (next === ratio) return;
    stashEmojis();                 // 先把当前比例这套收好（同步模式下是幂等写）
    stashView();                   // v5.0：取景/缩放也按比例存
    ratio = next;
    applyRatio();
    loadEmojiSetFor(next);         // 取这个比例自己的一份（同步模式下不动）
    loadView(next);                // v5.0：切到该比例自己的取景（没有就是默认居中偏上）
  });

  /* v4.89：「跟随其他比例」开关（比例栏最上方） */
  $("ratioSync").addEventListener("change", function () {
    if (!cfg) return;
    cfg.ratioSync = !!this.checked;
    if (cfg.ratioSync) {
      setStatus("已开启「跟随」：四个比例共用同一套元素", "ok");
    } else {
      stashEmojis();
      setStatus("已关闭「跟随」：每个比例各自一套元素（互不影响）", "ok");
    }
  });

  /* v5.2：多行输入（事件委托；输入时不重建 DOM，免得丢焦点） */
  $("copyRows").addEventListener("input", function (ev) {
    const inp = ev.target;
    if (!inp || inp.tagName !== "INPUT" || !cfg) return;
    const i = parseInt(inp.dataset.i, 10);
    if (!isFinite(i)) return;
    copyLines()[i] = inp.value;
    selLine = i;
    updateCount();
    paintText();
  });
  $("copyRows").addEventListener("focusin", function (ev) {
    const inp = ev.target;
    if (!inp || inp.tagName !== "INPUT") return;
    const i = parseInt(inp.dataset.i, 10);
    if (!isFinite(i)) return;
    selLine = i;
    $("copyRows").querySelectorAll(".crow").forEach(function (r, k) {
      r.classList.toggle("on", k === i);      // 只切样式，不重建
    });
    updateCount();
  });
  $("copyRows").addEventListener("click", function (ev) {
    const del = ev.target.closest && ev.target.closest(".del");
    if (del && cfg) {
      const rows = copyLines();
      if (rows.length <= 1) { setStatus("至少要留一行文案", "warn"); return; }
      const i = parseInt(del.dataset.del, 10);
      rows.splice(i, 1);
      selLine = Math.max(0, Math.min(selLine, rows.length - 1));
      renderCopyRows();
      paintText();
      return;
    }
    const row = ev.target.closest && ev.target.closest(".crow");
    if (row) {
      const i = parseInt(row.dataset.i, 10);
      if (isFinite(i)) { selLine = i; renderCopyRows(); }
    }
  });
  $("btnAddLine").addEventListener("click", function () {
    if (!cfg) return;
    const rows = copyLines();
    if (rows.length >= 5) { setStatus("最多 5 行文案", "warn"); return; }
    rows.push("");
    selLine = rows.length - 1;
    renderCopyRows();
    paintText();
    const inp = $("copyRows").querySelector('.crow[data-i="' + selLine + '"] input');
    if (inp) inp.focus();
  });

  $("btnCopy").addEventListener("click", async function () {
    const btn = this;
    btn.disabled = true;
    /* v4.84（用户 2026-11-14）：「这个 AI 优化文案的按钮，是优化**上方的文案内容**的，
       因为是封面文案，所以优化后的文案字数可以少一点」。
       以前发的是 `{title: cfg.copy.line1, summary: FILM}` —— 画布第一行 + 片名，
       用户填在框里的原文根本没进模型（而且后端 import 路径是坏的，点了必然失败）。
       现在：框里有字 ⇒ 以它为源**压缩**；框里空 ⇒ 退回按片名生成。 */
    /* v5.2：**只优化选中的那条**（需求：「选中哪条文案才能点击 AI 优化文案」） */
    const rows0 = copyLines();
    const sel = Math.max(0, Math.min(selLine, rows0.length - 1));
    const cur = String(rows0[sel] || "").trim();
    $("copyMsg").textContent = (cur ? "优化第 " + (sel + 1) + " 行中…" : "第 " + (sel + 1) + " 行为空，按片名生成…");
    try {
      const r = await slicer("POST", "/api/edits/cover/copy",
        { text: cur, title: FILM, summary: String(rows0[0] || "") });
      const cands = ((r || {}).data || {}).candidates || [];
      if (!cands.length) {
        const note = ((r || {}).data || {}).note || "";
        $("copyMsg").textContent = note || "没生成出候选（可手填）";
        return;
      }
      $("copyMsg").textContent = cur ? "点一条替换：" : "点一条填入：";
      window.__cands = cands;
      $("cands").innerHTML = cands.map(function (c, i) {
        const n = ((c.line1 || "") + (c.line2 || "")).length;
        return '<button class="candBtn" data-i="' + i + '">' + esc(c.line1) + " / " +
          esc(c.line2) + "（" + n + "字" + (c.tone ? "·" + esc(c.tone) : "") + "）</button>";
      }).join("");
    } catch (e) {
      $("copyMsg").textContent = "生成失败：" + (e.message || e);
    } finally {
      btn.disabled = false;
    }
  });
  $("cands").addEventListener("click", function (ev) {
    const b = ev.target.closest && ev.target.closest(".candBtn");
    if (!b) return;
    const c = (window.__cands || [])[parseInt(b.dataset.i, 10)];
    if (!c) return;
    const joined = ((c.line1 || "") + (c.line2 || "")).trim();
    /* v5.2：写回**选中的那一行**（不碰其它行），然后重绘 */
    const rows1 = copyLines();
    const k = Math.max(0, Math.min(selLine, rows1.length - 1));
    rows1[k] = joined;
    renderCopyRows();
    paintText();
    if (c.emoji) {
      cfg.emojis = [{ code: c.emoji, x: 0.62, y: 0.03, size: 0.16 }];
      selEmo = 0;
      syncEmojiSelFromCfg();
      renderEmojiChips();
      paintEmoji();
    }
  });

  function applyTpl(key) {
    const t = TPLS.filter(function (x) { return x.key === key; })[0] || TPLS[0];
    cfg.style = cfg.style || {};
    Object.keys(t).forEach(function (k) { if (k !== "key" && k !== "label") cfg.style[k] = t[k]; });
    cfg.template = t.key;
    syncControls();
    paintText();
  }
  $("tplSel").addEventListener("change", function () { applyTpl(this.value); });
  $("tplCards").addEventListener("click", function (ev) {
    const b = ev.target.closest && ev.target.closest(".tplcard");
    if (!b) return;
    applyTpl(b.dataset.key || "A");
  });
  $("tabNormal").addEventListener("click", function () { applyTpl("A"); });
  $("tabFlower").addEventListener("click", function () { applyTpl("C"); });

  /* v4.89：字号数值框（6–30 %，相对画布宽度；改字号要重折行） */
  function readInt(el, lo, hi, dflt) {
    const v = Math.round(parseFloat(el.value));
    if (!isFinite(v)) return dflt;
    return Math.max(lo, Math.min(hi, v));
  }
  $("sizeNum").addEventListener("input", function () {
    if (!cfg) return;
    cfg.style.sizeRatio = readInt(this, 6, 30, 12) / 100;
    paintText();               // v5.2：不再折行，只重绘
  });
  $("sizeNum").addEventListener("change", function () {
    if (!cfg) return;
    this.value = String(Math.round(parseFloat(cfg.style.sizeRatio || 0.12) * 100));
  });
  /* v5.2：原「自动折两行 / 手动换行」开关与 reflow() 已删除 ——
     行数由文案输入框的条数决定，不再自动折行。 */

  /* v4.89：描边数值框（0–40 px，相对 1080 基准宽） */
  $("strokeNum").addEventListener("input", function () {
    if (!cfg) return;
    cfg.style.strokeWidth = readInt(this, 0, 40, 10);
    paintText();
  });
  $("strokeNum").addEventListener("change", function () {
    if (!cfg) return;
    this.value = String(Math.round(parseFloat(cfg.style.strokeWidth || 10)));
  });
  $("fill1").addEventListener("input", function () {
    if (!cfg) return; cfg.style.fill1 = this.value; syncHex(); paintText();
  });
  $("fill2").addEventListener("input", function () {
    if (!cfg) return; cfg.style.fill2 = this.value; syncHex(); paintText();
  });
  $("strokeFill").addEventListener("input", function () {
    if (!cfg) return; cfg.style.strokeFill = this.value; syncHex(); paintText();
  });

  /* 通用弹层定位：贴着锚点按钮，下面放不下就向上翻 */
  function placePop(pop, r) {
    const w = pop.offsetWidth || 268;
    pop.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.right - w)) + "px";
    const h = pop.offsetHeight || 220;
    const below = window.innerHeight - r.bottom - 12;
    pop.style.top = (below >= h ? r.bottom + 8 : Math.max(12, r.top - h - 8)) + "px";
  }
  function placeBgPop() { placePop($("bgPop"), $("btnBg").getBoundingClientRect()); }

  /* 背景弹层（v4.82）：开关 + 模糊 + 压暗 */
  $("btnBg").addEventListener("click", function (ev) {
    ev.stopPropagation();
    if ($("bgPop").classList.toggle("show")) {
      applyBg(true);
      placeBgPop();
    }
  });
  document.addEventListener("click", function (ev) {
    const t = ev.target;
    if (t.closest && (t.closest("#bgPop") || t.closest("#btnBg"))) return;
    $("bgPop").classList.remove("show");
  });
  $("bgOn").addEventListener("click", function (ev) {
    ev.stopPropagation();
    bg.on = !bg.on;
    applyBg(true);
    scheduleBaseRefresh();
  });
  $("bgBlur").addEventListener("input", function () {
    bg.blur = Math.max(0, Math.min(40, parseInt(this.value, 10) || 0));
    applyBg(true);
    scheduleBaseRefresh();
  });
  $("bgShade").addEventListener("input", function () {
    bg.shade = Math.max(0, Math.min(0.85, (parseInt(this.value, 10) || 0) / 100));
    applyBg(true);
    scheduleBaseRefresh();
  });
  /* ---------------- v4.99：比例徽标 → 缩放按钮 ----------------
     需求（2026-11-14 截图指「4:3 · 1440×1080」徽标）：「这个改为按钮状态，点开就是滑块，
     滑动修改图片的放大和缩小」。zoom 只放大画面，取景焦点不变；1.0 = cover 基准。 */
  if ($("sizeBadge") && $("zoomPop")) {
    $("sizeBadge").addEventListener("click", function (ev) {
      ev.stopPropagation();
      $("zoomPop").classList.toggle("hidden");
      if ($("bgZoom")) syncRangeFill($("bgZoom"));
    });
    document.addEventListener("click", function (ev) {
      if (!ev.target.closest || !ev.target.closest("#zoomPop, #sizeBadge")) {
        $("zoomPop").classList.add("hidden");
      }
    });
  }
  if ($("bgZoom")) {
    $("bgZoom").addEventListener("input", function () {
      bg.zoom = Math.max(1, Math.min(3, Number(this.value) / 100));
      $("zoomVal").textContent = bg.zoom.toFixed(2).replace(/0$/, "") + "×";
      syncRangeFill(this);
      applyBg(true);                       // zoom 写进 cfg.background
      layoutPhoto();                       // 本地 CSS 即时生效（不用请求后端）
    });
  }
  if ($("zoomReset")) {
    $("zoomReset").addEventListener("click", function () {
      bg.zoom = 1;
      if ($("bgZoom")) { $("bgZoom").value = "100"; syncRangeFill($("bgZoom")); }
      $("zoomVal").textContent = "1.0×";
      applyBg(true);
      layoutPhoto();
    });
  }

  /* v4.98：取景的「居中」与「默认」（默认=水平居中、垂直偏上保人脸，与旧出图一致） */
  if ($("bgFocusCenter")) {
    $("bgFocusCenter").addEventListener("click", function () {
      bg.focus = {x: 0.5, y: 0.5};
      applyBg(true); layoutPhoto();
    });
  }
  if ($("bgFocusReset")) {
    $("bgFocusReset").addEventListener("click", function () {
      bg.focus = {x: 0.5, y: 0.35};
      applyBg(true); layoutPhoto();
    });
  }
  $("bgDefault").addEventListener("click", function () {
    bg = {on: true, blur: 22, shade: 0.47};
    applyBg(true);
    scheduleBaseRefresh();
  });
  $("bgRaw").addEventListener("click", function () {
    /* 用原图 = 不模糊 + 不压暗（想只去模糊、保留压暗，把开关关掉即可） */
    bg = {on: false, blur: bg.blur, shade: 0};
    applyBg(true);
    scheduleBaseRefresh();
  });

  /* emoji **下拉窗口**展开选择 */
  function placeEmoPop() {
    const btn = $("btnEmoji");
    const pop = $("emoPop");
    const r = btn.getBoundingClientRect();
    const w = Math.min(320, window.innerWidth - 24);
    pop.style.width = w + "px";
    pop.style.left = Math.max(12, Math.min(window.innerWidth - w - 12,
                                           r.right - w)) + "px";
    const h = pop.offsetHeight || 300;
    const below = window.innerHeight - r.bottom - 12;
    pop.style.top = (below >= h ? r.bottom + 8 : Math.max(12, r.top - h - 8)) + "px";
  }
  $("btnEmoji").addEventListener("click", function (ev) {
    ev.stopPropagation();
    const open = $("emoPop").classList.toggle("show");
    if (open) {
      fillEmojiThumbs();
      placeEmoPop();
      try { $("emoSearch").focus({preventScroll: true}); } catch (e) { $("emoSearch").focus(); }
    }
  });
  /* 面板一滚就收起：fixed 弹层不会跟着滚动，留着会"飘"在别的控件上 */
  document.querySelector(".panel").addEventListener("scroll", function () {
    $("emoPop").classList.remove("show");
  });
  window.addEventListener("resize", function () {
    if ($("emoPop").classList.contains("show")) placeEmoPop();
    if ($("bgPop").classList.contains("show")) placeBgPop();
  });
  /* 注意：断言要求保留 classList.toggle("show") 这一句（关闭路径在下面） */
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest || !ev.target.closest(".emowrap")) {
      $("emoPop").classList.remove("show");
    }
  });
  $("emoSearch").addEventListener("input", function () {
    const kw = String(this.value || "").trim().toLowerCase();
    $("emoGrid").querySelectorAll(".emoPick").forEach(function (b) {
      const nm = String(b.dataset.name || "").toLowerCase();
      const hit = !kw || nm.indexOf(kw) >= 0 || String(b.dataset.code || "").indexOf(kw) >= 0;
      b.style.display = hit ? "" : "none";
    });
  });
  $("emoPop").addEventListener("click", function (ev) {
    const b = ev.target.closest && ev.target.closest(".emoPick");
    if (!b) return;
    const code = b.dataset.code || "";
    if (!code || !cfg) return;
    /* v4.86：**追加**一颗（用户：「emoji 可以添加重复的，如新增两个相同的 emoji」）。
       以前是按 Set 重建整个数组 —— 同一个 code 加不了第二个，而且拖动过的位置会被抹掉。
       新加的一颗错开摆放，避免完全重叠在上一颗身上。 */
    cfg.emojis = cfg.emojis || [];
    const n = cfg.emojis.length;
    cfg.emojis.push({code: code,
                     x: Math.min(0.62 + (n % 3) * 0.12, 0.80),
                     y: Math.min(0.03 + Math.floor(n / 3) * 0.14, 0.70),
                     size: 0.15});
    selEmo = cfg.emojis.length - 1;
    syncEmojiSelFromCfg();
    renderEmojiChips();
    paintEmoji();
  });
  $("emoChips").addEventListener("click", function (ev) {
    /* × → 只删这一颗（按索引，不是按 code） */
    const del = ev.target.closest && ev.target.closest("b[data-del]");
    if (del) {
      const i = parseInt(del.dataset.del, 10);
      cfg.emojis = ((cfg.emojis) || []).filter(function (_, k) { return k !== i; });
      if (selEmo === i) selEmo = -1;
      else if (selEmo > i) selEmo -= 1;
      syncEmojiSelFromCfg();
      renderEmojiChips();
      paintEmoji();
      return;
    }
    /* 点 chip → 选中它（画布上出现虚线框，下方大小滑块跟着切到这一颗） */
    const chip = ev.target.closest && ev.target.closest(".chip[data-i]");
    if (!chip) return;
    selEmo = parseInt(chip.dataset.i, 10);
    renderEmojiChips();
    paintEmoji();
  });
  /* ---------------- v4.94：选图片（与 emoji 同一套坐标/大小） ----------------
     需求（2026-11-14）：「在 emoji 这个按钮位置新增一个选择图片的按钮，作用就是选择图片放到画布中，
     要注意的是选择的这个图片操作的大小也是使用 emoji 的大小控制滑块的」。
     实现：本地读文件 → canvas 压到最长边 512（PNG/WebP 保透明，其余转 JPEG）→
     data URI 直接存进 cfg.emojis（type=image，与 emoji 同数组、同 x/y/size），
     后端 `_paste_emoji(data=…)` 认这个字段画上去。不落额外文件、不用新接口。 */
  function pickImageAsDataUri(file, maxSide) {
    return new Promise(function (resolve, reject) {
      if (!file) { reject(new Error("没有选文件")); return; }
      if (!/^image\//.test(file.type || "")) { reject(new Error("不是图片文件")); return; }
      const fr = new FileReader();
      fr.onerror = function () { reject(new Error("读取文件失败")); };
      fr.onload = function () {
        const im = new Image();
        im.onerror = function () { reject(new Error("图片解码失败")); };
        im.onload = function () {
          const w0 = im.naturalWidth || 1, h0 = im.naturalHeight || 1;
          const k = Math.min(1, (maxSide || 512) / Math.max(w0, h0));
          const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(im, 0, 0, w, h);
          const keepAlpha = /png|webp|svg/i.test(file.type || "");
          try {
            resolve(cv.toDataURL(keepAlpha ? "image/png" : "image/jpeg", 0.92));
          } catch (e) {
            reject(new Error("转换失败：" + (e.message || e)));
          }
        };
        im.src = String(fr.result || "");
      };
      fr.readAsDataURL(file);
    });
  }

  $("btnEmoImg").addEventListener("click", function () {
    if (!cfg) return;
    $("emoImgFile").click();
  });
  $("emoImgFile").addEventListener("change", async function () {
    const f = this.files && this.files[0];
    this.value = "";                 // 复位：允许连续选同一个文件
    if (!f || !cfg) return;
    try {
      const data = await pickImageAsDataUri(f, 512);
      cfg.emojis = cfg.emojis || [];
      const n = cfg.emojis.length;
      cfg.emojis.push({type: "image", data: data,
                       x: Math.min(0.30 + (n % 3) * 0.12, 0.80),
                       y: Math.min(0.10 + Math.floor(n / 3) * 0.14, 0.70),
                       size: 0.25});
      selEmo = cfg.emojis.length - 1;
      syncEmojiSelFromCfg();
      renderEmojiChips();
      paintEmoji();
      setStatus("图片已放到画布：可拖动，大小用下面的 emoji 滑块调", "ok");
    } catch (e) {
      setStatus("加图片失败：" + (e.message || e), "err");
    }
  });

  /* v4.86：拖滑块实时改**选中那一颗**的大小 */
  $("emoSize").addEventListener("input", function () {
    const e = ((cfg && cfg.emojis) || [])[selEmo];
    if (!e) return;
    const pct = Number(this.value) || 15;
    e.size = Math.max(0.04, Math.min(0.60, pct / 100));
    $("emoSizeVal").textContent = Math.round(e.size * 100) + "%";
    paintEmoji();
  });

  /* v4.81：WebView2 **不支持 window.prompt**（点了没反应），改成行内输入框 */
  $("btnSaveStyle").addEventListener("click", function () {
    const all = loadMyStyles();
    let name = ($("styleName").value || "").trim();
    if (!name) name = "样式 " + (Object.keys(all).length + 1);
    all[name] = JSON.parse(JSON.stringify((cfg && cfg.style) || {}));
    try { localStorage.setItem(MYSTYLE_KEY, JSON.stringify(all)); } catch (e) { /* 隐私模式 */ }
    $("myStyleMsg").textContent = "已存：" + name;
    $("styleName").value = "";
    renderMyStyles();
  });
  $("myStyleSel").addEventListener("change", function () {
    if (!this.value) return;
    const st = loadMyStyles()[this.value];
    if (!st) return;
    cfg.style = JSON.parse(JSON.stringify(st));
    syncControls(); paintText();
    $("myStyleMsg").textContent = "已套用：" + this.value;
  });

  $("btnGen").addEventListener("click", async function () {
    const btn = this;
    stashEmojis();                 // v4.89：当前比例这套写回 emojisByRatio
    /* v5.2：提交 copy.lines（每条一行）；line1/line2/text 仍写一份，供老读法与其它模块兼容 */
    const rowsGen = copyLines().map(function (v) { return String(v || "").trim(); }).filter(Boolean);
    if (!rowsGen.length) { setStatus("先填文案（至少一行）", "warn"); return; }
    cfg.copy = cfg.copy || {};
    cfg.copy.lines = rowsGen;
    cfg.copy.line1 = rowsGen[0];
    cfg.copy.line2 = rowsGen.slice(1).join("\n");
    cfg.copy.text = rowsGen.join("");
    delete cfg.copy.twoLine;
    btn.disabled = true;
    setStatus("保存并重渲染四档中…", "warn");
    try {
      const r = await slicer("POST", "/api/edits/cover/design", { name: FILM, config: cfg });
      if (r.status !== 200 || !(r.data && r.data.ok)) {
        setStatus("保存失败：" + ((r.data && r.data.error) || r.status), "err");
        return;
      }
      covers = (r.data || {}).covers || [];
      applyRatio();
      setStatus("✓ 已生成四档封面（" + (r.data.generated ? "本次重渲染" : "复用") + "）", "ok");
    } catch (e) {
      setStatus("保存失败：" + (e.message || e), "err");
    } finally {
      btn.disabled = false;
    }
  });

  /* v4.87：无边框窗口拖动 —— 顶栏按住拖（用户要的是把系统标题栏去掉，
     去掉后必须自己给一个拖动手势）。
     说明：不用 pywebview 的 easy_drag —— 它会把画布里文字/emoji 的拖动一起抢走；
     这里只认顶栏，排除按钮/比例药丸/输入控件，增量经 rAF 节流后交给桥的 Window.move。 */
  (function bindWindowDrag() {
    const top = document.querySelector("header.top");
    if (!top) return;
    let last = null, acc = null, raf = 0;
    function flush() {
      raf = 0;
      const d = acc;
      acc = null;
      if (!d || (!d.dx && !d.dy)) return;
      const api = getBridge();
      if (api && api.designer_move_window) {
        try { api.designer_move_window(d.dx, d.dy); } catch (e) { /* 拖动失败不影响其它 */ }
      }
    }
    top.addEventListener("mousedown", function (ev) {
      if (ev.button !== 0) return;
      if (ev.target.closest && ev.target.closest("button, input, select, a, .ratiobar")) return;
      last = {x: ev.screenX, y: ev.screenY};
      top.classList.add("dragging");
      ev.preventDefault();
    });
    window.addEventListener("mousemove", function (ev) {
      if (!last) return;
      const dx = ev.screenX - last.x, dy = ev.screenY - last.y;
      if (!dx && !dy) return;
      last = {x: ev.screenX, y: ev.screenY};
      acc = acc || {dx: 0, dy: 0};
      acc.dx += dx;
      acc.dy += dy;
      if (!raf) raf = requestAnimationFrame(flush);
    });
    window.addEventListener("mouseup", function () {
      if (!last) return;
      last = null;
      top.classList.remove("dragging");
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      flush();
    });
  })();

  async function closeWindow() {
    const api = getBridge();
    if (api && api.close_cover_designer) {
      try { await api.close_cover_designer(); return; } catch (e) { /* 兜底 */ }
    }
    window.close();
  }
  $("btnCancel").addEventListener("click", closeWindow);
  $("btnClose").addEventListener("click", closeWindow);

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      if ($("bgPop").classList.contains("show")) { $("bgPop").classList.remove("show"); return; }
      if ($("emoPop").classList.contains("show")) { $("emoPop").classList.remove("show"); return; }
      closeWindow();
      return;
    }
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") { $("btnGen").click(); }
  });

  window.addEventListener("resize", fitCanvas);

  /* ---------------- 启动 ---------------- */
  async function boot() {
    /* v5.2：demo 模式（无桥环境预览/截图）不需要桥，直接渲染 */
    if (/[?&]demo=1/.test(location.search)) { await loadDesign(); return; }
    const api = getBridge();
    if (!api) { setTimeout(boot, 200); return; }
    try {
      const t = await api.cover_designer_target();
      if (t && t.ok && t.film) FILM = t.film;
    } catch (e) { /* fallback */ }
    if (!FILM) {
      setStatus("拿不到成片名 —— 请回主窗口成片行重新点「封面图」", "err");
      $("hint").innerHTML = "<span>没有成片信息，无法预览底图</span>";
      return;
    }
    /* FILM 可能是带前缀的相对路径 —— 顶栏只显示文件名那一段更好认 */
    $("filmName").textContent = String(FILM).split("/").filter(Boolean)
      .filter(function (x) { return x !== "edits"; })
      .slice(-2).join(" / ");
    $("filmName").title = FILM;
    document.title = "封面设计 · " + FILM;
    $("hint").style.display = "flex";
    loadDesign();
  }
  boot();
})();
</script>
